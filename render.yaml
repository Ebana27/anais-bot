services:
  - type: web
    name: anais-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QR_VIEW_PASSWORD
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ANAIS_OWNER_NAME
        value: neocodex
      - key: ANAIS_OWNER_NUMBER
        value: '067756084'
      - key: WHATSAPP_GROUPS
        value: ''
      - key: AMBIENT_REPLY_CHANCE
        value: '0.70'
      - key: MIN_AMBIENT_GAP_MS
        value: '15000'
      - key: MIN_REPLY_DELAY_MS
        value: '80000'
      - key: MAX_REPLY_DELAY_MS
        value: '80000'
      - key: MESSAGE_BATCH_WINDOW_MS
        value: '1800'
